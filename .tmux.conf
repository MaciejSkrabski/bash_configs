bind-key C-s set-window-option synchronize-panes

set -g mouse off
set -g history-limit 50000
set -g display-time 4000
set -g set-clipboard external
set -g default-terminal "screen-256color"
set -g focus-events on


# Catppuccin Mocha palette
set -g @catppuccin_base    '#1e1e2e'
set -g @catppuccin_mantle  '#181825'
set -g @catppuccin_crust   '#11111b'
set -g @catppuccin_surface '#313244'
set -g @catppuccin_overlay '#6c7086'
set -g @catppuccin_text    '#cdd6f4'
set -g @catppuccin_subtext '#a6adc8'
set -g @catppuccin_blue    '#89b4fa'
set -g @catppuccin_mauve   '#cba6f7'
set -g @catppuccin_green   '#a6e3a1'
set -g @catppuccin_yellow  '#f9e2af'
set -g @catppuccin_red     '#f38ba8'
set -g @catppuccin_teal    '#94e2d5'

# General status-line settings
set -g status on
set -g status-position bottom
set -g status-interval 5

set -g status-style \
    "bg=#{@catppuccin_mantle},fg=#{@catppuccin_text}"

# Session name
set -g status-left-length 40
set -g status-left \
    '#[fg=#{@catppuccin_mantle},bg=#{@catppuccin_mauve},bold] #S #[fg=#{@catppuccin_mauve},bg=#{@catppuccin_mantle}]'


# Windows
set -g window-status-separator ''

set -g window-status-format \
    "#[fg=#{@catppuccin_overlay},bg=#{@catppuccin_mantle}] #I:#W "

set -g window-status-current-format \
    "#[fg=#{@catppuccin_mantle},bg=#{@catppuccin_blue},bold] #I:#W "

# Hostname and clock
set -g status-right-length 100
set -g status-right \
    '#[fg=#{@catppuccin_mantle},bg=#{@catppuccin_teal},bold] #H #[fg=#{@catppuccin_mantle},bg=#{@catppuccin_yellow},bold] %H:%M '


# Pane borders
# Normal pane border
set -g pane-border-style \
    'fg=#{?pane_synchronized,#{@catppuccin_red},#{@catppuccin_surface}}'

# Active pane border
set -g pane-active-border-style \
    'fg=#{?pane_synchronized,#{@catppuccin_red},#{@catppuccin_blue}}'


# Messages and command prompt
set -g message-style \
    "bg=#{@catppuccin_surface},fg=#{@catppuccin_text}"

set -g message-command-style \
    "bg=#{@catppuccin_surface},fg=#{@catppuccin_text}"

# Copy mode
set -g mode-style \
    "bg=#{@catppuccin_surface},fg=#{@catppuccin_text}"

# Clock mode
set -g clock-mode-colour '#cba6f7'
set -g clock-mode-style 24

# Convenient reload binding
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'

